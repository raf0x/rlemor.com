name: Menagerie RC validation
on:
  push:
    branches: [experiments/menagerie-v4-dual-light-environments]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Menagerie source contracts
        run: |
          node scripts/verify-menagerie-camera.mjs
          node scripts/verify-menagerie-inspection.mjs
          node scripts/verify-menagerie-installations.mjs
          node scripts/verify-menagerie-lighting.mjs
          node scripts/verify-menagerie-shell.mjs
          node scripts/verify-octave-spectrum.mjs
      - name: TypeScript and ESLint
        run: |
          npx tsc --noEmit
          npm run lint
      - name: Production build
        run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start production server
        run: |
          npm run start -- --port 3000 > /tmp/menagerie-next.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://localhost:3000/lab/menagerie-preview-76cf184b >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/menagerie-next.log
          exit 1
      - name: Six-exhibit browser smoke matrix
        run: node scripts/verify-menagerie-browser.mjs
