name: Showcase QA

on:
  push:
    branches:
      - qa/lighthouse-showcase-fix

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out final production commit
        uses: actions/checkout@v4
        with:
          ref: 6cd56f583307d9fff3dcfba6dfaafbcdb036efaa
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check HEAD^ HEAD
      - name: Responsive overflow check
        shell: bash
        run: |
          npm install --no-save --package-lock=false chrome-remote-interface@0.33.3
          npm start -- -p 3000 > /tmp/rlemor-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Using Chrome: $CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --user-data-dir=/tmp/rlemor-chrome-profile about:blank > /tmp/rlemor-chrome.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:9222/json/version > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version > /dev/null || { cat /tmp/rlemor-chrome.log; exit 1; }

          node <<'NODE'
          const CDP = require("chrome-remote-interface");

          const checks = [
            [390, 1600, "/"],
            [1440, 1600, "/"],
            [390, 2200, "/work"],
            [1440, 1800, "/work"],
            [390, 2200, "/work/mypepprotocol"],
            [1440, 1800, "/work/mypepprotocol"],
          ];

          (async () => {
            const client = await CDP();
            const { Page, Runtime, Emulation } = client;
            await Page.enable();

            for (const [width, height, path] of checks) {
              await Emulation.setDeviceMetricsOverride({
                width,
                height,
                deviceScaleFactor: 1,
                mobile: width <= 390,
              });

              const loaded = new Promise((resolve) => Page.loadEventFired(resolve));
              await Page.navigate({ url: `http://127.0.0.1:3000${path}` });
              await loaded;

              await Runtime.evaluate({
                expression: `Promise.all(Array.from(document.images).map((img) => img.complete ? true : new Promise((resolve) => { img.addEventListener("load", resolve, { once: true }); img.addEventListener("error", resolve, { once: true }); })))`,
                awaitPromise: true,
              });

              const measurement = await Runtime.evaluate({
                expression: `({
                  htmlScrollWidth: document.documentElement.scrollWidth,
                  htmlClientWidth: document.documentElement.clientWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                  viewportWidth: window.innerWidth
                })`,
                returnByValue: true,
              });

              const value = measurement.result.value;
              console.log(`${width}px ${path}`, value);

              if (
                value.htmlScrollWidth > value.viewportWidth + 1 ||
                value.bodyScrollWidth > value.viewportWidth + 1
              ) {
                throw new Error(`Horizontal overflow at ${width}px on ${path}`);
              }
            }

            await client.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
